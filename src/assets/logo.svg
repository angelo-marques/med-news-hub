<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4F8A"/>
      <stop offset="100%" stop-color="#0D3468"/>
    </linearGradient>
    <linearGradient id="helixBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82C4"/>
      <stop offset="100%" stop-color="#2563A8"/>
    </linearGradient>
  </defs>

  <!-- Medical cross background shape -->
  <rect x="70" y="10" width="60" height="170" rx="12" fill="url(#crossGrad)"/>
  <rect x="10" y="70" width="180" height="60" rx="12" fill="url(#crossGrad)"/>

  <!-- DNA helix left strand (blue) -->
  <path d="M52 30 C46 50, 54 70, 48 90 C42 110, 50 130, 44 150 C38 165, 46 175, 52 178"
        stroke="#3B82C4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- DNA helix right strand (green) -->
  <path d="M148 30 C154 50, 146 70, 152 90 C158 110, 150 130, 156 150 C162 165, 154 175, 148 178"
        stroke="#5BAD6F" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Horizontal rungs of DNA -->
  <line x1="52" y1="48"  x2="148" y2="48"  stroke="#7CB8E8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="49" y1="72"  x2="151" y2="72"  stroke="#7CB8E8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="48" y1="96"  x2="152" y2="96"  stroke="#7CB8E8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="49" y1="120" x2="151" y2="120" stroke="#7CB8E8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="52" y1="144" x2="148" y2="144" stroke="#7CB8E8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="52" y1="168" x2="148" y2="168" stroke="#7CB8E8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- White cross highlight overlay -->
  <rect x="88" y="28" width="24" height="134" rx="6" fill="white" opacity="0.12"/>
  <rect x="28" y="88" width="144" height="24" rx="6" fill="white" opacity="0.12"/>

  <!-- "Vexlyn News" text -->
  <text x="100" y="208" font-family="Georgia, 'Times New Roman', serif"
        font-size="20" font-weight="700" fill="#1B4F8A"
        text-anchor="middle" letter-spacing="1">Vexlyn News</text>
</svg>
