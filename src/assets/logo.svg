<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#1565C0" stroke-width="1.5"/>

  <!-- Medical cross -->
  <rect x="27" y="14" width="10" height="36" rx="3" fill="white" opacity="0.95"/>
  <rect x="14" y="27" width="36" height="10" rx="3" fill="white" opacity="0.95"/>

  <!-- DNA double helix lines overlaid -->
  <path d="M22 18 Q32 24 42 18" stroke="#4CAF50" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M22 46 Q32 40 42 46" stroke="#4CAF50" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Small dots on helix -->
  <circle cx="22" cy="18" r="2" fill="#4CAF50"/>
  <circle cx="42" cy="18" r="2" fill="#4CAF50"/>
  <circle cx="22" cy="46" r="2" fill="#4CAF50"/>
  <circle cx="42" cy="46" r="2" fill="#4CAF50"/>

  <!-- Gradient defs -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="60%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
</svg>
