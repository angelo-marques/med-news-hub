<header class="fixed top-0 left-0 right-0 z-50 shadow-md" style="background: var(--header-bg); box-shadow: var(--header-shadow); border-bottom: 1px solid var(--border-color);" role="banner">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/home" class="flex items-center gap-3 no-underline min-w-0" aria-label="Vexlyn News - Página inicial">
        <img
          src="assets/logo.svg"
          alt="Vexlyn News"
          class="h-10 sm:h-12 w-auto object-contain"
          loading="eager"
        >
        <div class="hidden md:block text-xs uppercase tracking-wide truncate" style="color: var(--text-secondary);">
          Portal de Pesquisas Médicas
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-1" role="navigation" aria-label="Navegação principal">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active-nav"
            class="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 no-underline"
            style="color: var(--text-primary);"
            [attr.aria-label]="item.label"
          >
            <mat-icon style="font-size: 18px; width: 18px; height: 18px;">{{item.icon}}</mat-icon>
            {{item.label}}
          </a>
        }
      </nav>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <!-- Search toggle -->
        <button mat-icon-button (click)="toggleSearch()" [attr.aria-label]="searchVisible() ? 'Fechar busca' : 'Abrir busca'" class="transition-all">
          <mat-icon>{{searchVisible() ? 'close' : 'search'}}</mat-icon>
        </button>

        <!-- Theme toggle -->
        <button mat-icon-button (click)="themeService.toggle()" [attr.aria-label]="themeService.label()" class="transition-all">
          <mat-icon>{{themeService.icon()}}</mat-icon>
        </button>

        <!-- Mobile menu -->
        <button mat-icon-button class="md:hidden" (click)="toggleMobileMenu()" aria-label="Menu mobile">
          <mat-icon>{{mobileMenuOpen() ? 'close' : 'menu'}}</mat-icon>
        </button>
      </div>
    </div>

    <!-- Search bar -->
    @if (searchVisible()) {
      <div class="pb-3 animate-fade-in">
        <div class="relative">
          <mat-icon class="absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--text-secondary);">search</mat-icon>
          <input
            type="search"
            placeholder="Buscar artigos, autores, condições médicas..."
            class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm outline-none"
            style="background: var(--bg-primary); border: 2px solid var(--border-color); color: var(--text-primary);"
            [value]="articleService.searchQuery()"
            (input)="onSearch($any($event.target).value)"
            aria-label="Campo de busca"
            autofocus
          >
        </div>
      </div>
    }

    <!-- Mobile menu -->
    @if (mobileMenuOpen()) {
      <nav class="md:hidden pb-4 animate-fade-in" role="navigation" aria-label="Navegação mobile">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active-nav"
            (click)="toggleMobileMenu()"
            class="flex items-center gap-3 px-4 py-3 rounded-lg no-underline mb-1 transition-all"
            style="color: var(--text-primary);"
          >
            <mat-icon>{{item.icon}}</mat-icon>
            <span class="font-medium">{{item.label}}</span>
          </a>
        }
      </nav>
    }
  </div>
</header>
