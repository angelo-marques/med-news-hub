name: Fetch and Update Medical Articles

on:
  schedule:
    # 3x ao dia: 6h, 14h, 22h UTC
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_ai:
        description: 'Forçar reprocessamento de IA nos artigos existentes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write   # necessário para disparar o deploy workflow

jobs:
  fetch-articles:
    name: Fetch Articles from Medical Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O script usa apenas módulos nativos do Node.js (https, fs, path)
      # Não precisa de npm install
      - name: Run article fetch script
        run: node scripts/fetch-articles.js
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          FORCE_AI:            ${{ inputs.force_ai || 'false' }}
          NODE_ENV:            production

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/assets/data/articles.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated articles
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/assets/data/articles.json
          ARTICLE_COUNT=$(node -e "const a=require('./src/assets/data/articles.json'); console.log(a.length)")
          git commit -m "chore: auto-update articles.json [$ARTICLE_COUNT artigos] $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: No changes found
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "Nenhum artigo novo. articles.json não foi alterado."

      # Dispara o deploy somente se articles.json foi atualizado
      - name: Trigger deploy workflow
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            console.log('Deploy workflow triggered.');
