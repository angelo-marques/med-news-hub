name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy Angular App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Descobre o nome do repositório para definir o base-href correto
      # Ex: angelo-marques/med-news-hub → /med-news-hub/
      - name: Build production
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "Base href: /${REPO_NAME}/"
          npx ng build --configuration production --base-href "/${REPO_NAME}/"
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # 404.html = índice do Angular → suporte ao roteamento SPA
      - name: Create 404.html for SPA routing
        run: cp dist/med-news-hub/browser/index.html dist/med-news-hub/browser/404.html

      # Publica na branch gh-pages automaticamente
      # Não requer configuração manual em Settings → Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/med-news-hub/browser
          force_orphan: true          # branch gh-pages sempre limpa
          enable_jekyll: false        # desabilita Jekyll (equivale ao .nojekyll)
          commit_message: "deploy: ${{ github.sha }}"
