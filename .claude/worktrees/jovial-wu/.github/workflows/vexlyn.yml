name: Vexlyn News – CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
#   push → main          : apenas deploy (código novo)
#   schedule (3x/dia)    : busca artigos → se mudou, build + deploy
#   workflow_dispatch     : controle manual completo
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6  * * *'   # 06:00 UTC (03:00 BRT)
    - cron: '0 14 * * *'   # 14:00 UTC (11:00 BRT)
    - cron: '0 22 * * *'   # 22:00 UTC (19:00 BRT)
  workflow_dispatch:
    inputs:
      run_fetch:
        description: 'Buscar novos artigos do PubMed + gerar resumos com IA'
        type: boolean
        default: true
      force_ai:
        description: 'Reprocessar resumos de IA nos artigos existentes'
        type: boolean
        default: false
      force_deploy:
        description: 'Forçar deploy mesmo sem mudanças nos artigos'
        type: boolean
        default: false

# Evita deploys simultâneos; cancela runs anteriores do mesmo branch
concurrency:
  group: vexlyn-cicd-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Permissões
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write   # push de articles.json e da branch gh-pages

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 – fetch
# Executa em: schedule  |  workflow_dispatch (quando run_fetch=true)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  fetch:
    name: Fetch Articles (PubMed + IA)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_fetch == true)

    outputs:
      articles_changed: ${{ steps.check.outputs.changed }}
      article_count:    ${{ steps.check.outputs.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O script usa apenas built-ins do Node (https, fs, path) — sem npm install
      - name: Fetch articles + generate AI summaries
        run: node scripts/fetch-articles.js
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          FORCE_AI:            ${{ inputs.force_ai || 'false' }}
          NODE_ENV:            production

      - name: Check for changes in articles.json
        id: check
        run: |
          COUNT=$(node -e "const a=require('./src/assets/data/articles.json'); console.log(a.length)")
          echo "count=$COUNT" >> $GITHUB_OUTPUT

          if git diff --quiet src/assets/data/articles.json src/assets/data/ai-observability.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭  Nenhuma mudança nova em artigos/observabilidade."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Dados atualizados — $COUNT artigos no total + métricas de observabilidade."
          fi

      - name: Commit updated data files
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add src/assets/data/articles.json src/assets/data/ai-observability.json
          git commit -m "chore: auto-update articles + observability [${{ steps.check.outputs.count }} artigos] $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 – deploy
# Executa em:
#   push → main           : sempre (código novo)
#   após fetch            : somente se articles.json mudou
#   workflow_dispatch     : se force_deploy=true OU run_fetch=false
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [fetch]
    # always() → roda mesmo quando fetch foi pulado (push event)
    # !failure() → não roda se fetch falhou com erro
    if: >
      always() && !failure() && (
        github.event_name == 'push' ||
        needs.fetch.outputs.articles_changed == 'true' ||
        inputs.force_deploy == true ||
        (github.event_name == 'workflow_dispatch' && inputs.run_fetch == false)
      )

    steps:
      - name: Checkout (último commit do main)
        uses: actions/checkout@v4
        with:
          ref: main   # garante que pega o commit do fetch (se houve push acima)

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production
        run: |
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "📦 Building with --base-href /${REPO_NAME}/"
          npx ng build --configuration production --base-href "/${REPO_NAME}/"
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Copia index.html → 404.html para que o roteamento SPA (Angular Router)
      # funcione ao acessar rotas diretamente (ex: /artigos, /fontes)
      - name: Create 404.html for Angular SPA routing
        run: cp dist/med-news-hub/browser/index.html dist/med-news-hub/browser/404.html

      # Publica na branch gh-pages
      # Configurar em: Settings → Pages → Branch: gh-pages → / (root)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ./dist/med-news-hub/browser
          force_orphan: true          # gh-pages sempre com histórico limpo
          enable_jekyll: false        # equivale ao .nojekyll
          commit_message: "deploy: ${{ github.sha }}"

      - name: Job summary
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          REPO=$(echo "$GITHUB_REPOSITORY"  | cut -d'/' -f2)
          echo "## 🚀 Deploy concluído" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://${OWNER}.github.io/${REPO}/ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
